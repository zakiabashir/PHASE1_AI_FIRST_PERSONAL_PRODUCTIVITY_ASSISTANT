# =============================================================================
# CI Pipeline for AI Productivity Assistant
# Triggers: Push to any branch, Pull Requests
# =============================================================================
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  security-events: write

env:
  # Python version for backend
  PYTHON_VERSION: '3.12'
  # Node version for frontend
  NODE_VERSION: '20'

# Concurrency: Limit to one run per branch, cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Backend CI Job
  # =============================================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python with caching for dependencies
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          pip install -r requirements.txt

      # Linting with ruff
      - name: Lint with ruff
        run: |
          ruff check src/ --output-format=github
        continue-on-error: true

      # Type checking with mypy (optional, won't fail the build)
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

      # Run tests with pytest
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          GROQ_API_KEY: test_key_for_ci

      # Upload coverage reports
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      # Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image (don't push yet)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ai-productivity-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Security scan with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-productivity-backend:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      # Upload Trivy results to GitHub Security tab
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      # Smoke test the Docker image
      - name: Smoke test Docker image
        run: |
          docker run -d --name backend-test -p 8000:8000 ai-productivity-backend:test
          sleep 10
          curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:8000/health
          docker stop backend-test

  # =============================================================================
  # Frontend CI Job
  # =============================================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js with caching
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Lint with ESLint
      - name: Lint with ESLint
        run: npm run lint
        continue-on-error: false

      # Build production bundle
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://huggingface.co/spaces/YOUR_USERNAME/ai-productivity-backend

      # Verify build output exists
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi
          echo "Build successful - output files:"
          ls -la dist/

      # Upload build artifact for deployment
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================================
  # Security Scan Job (runs after backend builds image)
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan for secrets in code
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      # Run Trivy on the filesystem
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
        continue-on-error: true

  # =============================================================================
  # CI Summary Job
  # =============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "::error::CI pipeline failed"
            exit 1
          fi
          echo "CI pipeline completed successfully"

      - name: Create summary
        run: |
          echo "## CI Pipeline Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-ci.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-ci.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
